# /etc/systemd/system/ventoux-stream.service.d/arret.conf
[Service]
# Quinze secondes pour s'arrêter, et non les quatre-vingt-dix par défaut.
#
# Le 18 novembre, à chaque plantage, des ffmpeg bloqués en lecture ont fait
# attendre systemd quatre-vingt-dix secondes avant le SIGKILL, puis
# RestartSec ajoutait ses quarante-cinq : plus de deux minutes d'antenne
# noire, que YouTube ne pardonne pas.
TimeoutStopSec=15
