[Service]
# Quarante-cinq secondes avant de reprendre, et non dix.
#
# Le premier octobre a 09h17, la webcam a renvoye un 404 pendant deux minutes.
# Le flux est sorti en erreur, systemd l'a relance dix secondes plus tard, qui
# est ressorti, huit fois de suite. Chacun de ces departs avait ouvert puis
# ferme la connexion RTMP vers YouTube, et une diffusion dont l'arrivee
# clignote huit fois en deux minutes est une diffusion que YouTube termine.
#
# La vraie correction est dans stream.py, qui attend desormais la webcam au
# lieu de ressortir. Ceci est la ceinture : meme sur un plantage qu'on n'a pas
# prevu, l'arrivee ne peut plus clignoter.
RestartSec=45
