name: pages

# Le site partait à chaque poussée, donc toutes les quinze minutes quand la
# veille publie, et il est lisible de tout le monde alors que le dépôt est
# privé. On l'a donc mis à la demande : rien ne sort tout seul tant que la
# reconnaissance du quotidien n'est pas fiable.
#
# Cela a eu une conséquence que personne n'avait voulue. Le seul déclencheur
# automatique restant était la dernière étape du workflow de relecture, si
# bien que la fraîcheur du site s'est mise à dépendre de quelqu'un en train de
# juger une carte : le 30 septembre, aucun verdict de la journée, et la page
# montrait encore trois heures du matin à dix-sept heures passées. Un jour
# sans relecture était devenu un jour sans site.
#
# D'où une horloge, toutes les heures pendant qu'il fait jour — de cinq à dix-
# neuf heures UTC, ce qui couvre le lever et le coucher du soleil sur ce
# versant en toute saison. La nuit n'a rien à montrer que le lampadaire du
# chalet. La prudence tient toujours : ce sont les heures qui publient, pas
# les commits, et couper ces trois lignes refige le site aussitôt.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5-19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the exhibition
        run: |
          mkdir -p _site/data/thumbs
          cp -R site/. _site/
          cp data/events.json _site/data/events.json
          cp config/relief.json _site/data/relief.json
          # Le calage de la caméra : la carte y lit le cap et le champ réels
          # plutôt que de les porter en dur.
          cp config/scene.json _site/data/scene.json
          if [ -f data/learning.json ]; then cp data/learning.json _site/data/learning.json; fi
          if [ -f data/view.json ]; then cp data/view.json _site/data/view.json; fi
          if [ -f data/view.jpg ]; then cp data/view.jpg _site/data/view.jpg; fi
          if [ -d data/thumbs ]; then cp -R data/thumbs/. _site/data/thumbs/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
