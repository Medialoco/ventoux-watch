name: pages

# Le site partait à chaque poussée, donc toutes les quinze minutes quand la
# veille publie. On l'a donc mis à la demande : les commits ne publient pas
# la page, l'horloge si.
#
# Cela a eu une conséquence que personne n'avait voulue. Le seul déclencheur
# automatique restant était la dernière étape du workflow de relecture, si
# bien que la fraîcheur du site s'est mise à dépendre de quelqu'un en train de
# juger une carte : le 30 septembre, aucun verdict de la journée, et la page
# montrait encore trois heures du matin à dix-sept heures passées. Un jour
# sans relecture était devenu un jour sans site.
#
# D'où une horloge, toutes les heures pendant qu'il fait jour — de cinq à dix-
# neuf heures UTC, ce qui couvre le lever et le coucher du soleil sur ce
# versant en toute saison. La nuit n'a rien à montrer que le lampadaire du
# chalet. La prudence tient toujours : ce sont les heures qui publient, pas
# les commits, et couper ces trois lignes refige le site aussitôt.
on:
  workflow_dispatch:
  schedule:
    # Deux fois par heure, et jamais à l'heure pile. GitHub n'exécute pas les
    # horloges qu'on lui donne : il les met dans une file commune et jette ce
    # qu'il ne peut pas servir, d'autant plus à la minute zéro où tout le monde
    # se réveille en même temps. Sur une journée, « toutes les heures » a donné
    # 18 h 37, 22 h 57, 10 h 48, 16 h 25 — quatre passages pour quinze demandés,
    # et des trous de six heures pendant lesquels le site montrait un historique
    # périmé et des photos manquantes. Deux rendez-vous en minutes creuses
    # valent mieux qu'un seul à l'heure ronde, et si les deux passent on perd
    # une demi-heure de fraîcheur au lieu d'une journée.
    - cron: "7,37 5-19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the exhibition
        run: |
          mkdir -p _site/data/thumbs _site/data/closeups
          cp -R site/. _site/
          cp data/events.json _site/data/events.json
          cp config/relief.json _site/data/relief.json
          # Le calage de la caméra : la carte y lit le cap et le champ réels
          # plutôt que de les porter en dur.
          cp config/scene.json _site/data/scene.json
          # Le numéro du direct en cours. Le site personnel l'incruste, et il
          # change chaque fois que YouTube termine la diffusion et qu'on en
          # rouvre une : écrit en dur dans une page, il finirait par désigner
          # un enregistrement fini.
          if [ -f data/direct.json ]; then cp data/direct.json _site/data/direct.json; fi
          if [ -f data/learning.json ]; then cp data/learning.json _site/data/learning.json; fi
          if [ -f data/view.json ]; then cp data/view.json _site/data/view.json; fi
          if [ -f data/view.jpg ]; then cp data/view.jpg _site/data/view.jpg; fi
          if [ -d data/thumbs ]; then cp -R data/thumbs/. _site/data/thumbs/; fi
          # La découpe que le modèle a vue, à la résolution de la source. La
          # vignette fait 480 pixels de large pour une image de 1920 : le sujet
          # y tient sur trente pixels, et juger une carte revient à deviner.
          # Douze mégaoctets pour huit cents découpes, contre soixante-cinq de
          # vignettes déjà publiées — le prix de pouvoir regarder.
          if [ -d data/closeups ]; then cp -R data/closeups/. _site/data/closeups/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
