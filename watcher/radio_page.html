<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>#FREETECHNORADIO</title>
  <meta name="description" content="#FREETECHNORADIO — web radio from a Raspberry Pi. Free music on the air.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
      color: #e9eaec;
      background: linear-gradient(165deg, #1a1f24 0%, #0d1014 100%);
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
      padding: 28px 20px 40px;
      text-align: center;
      border: 1px solid color-mix(in srgb, #9dd3ba 40%, #2b2f36);
      border-radius: 12px;
      box-shadow:
        0 0 0 1px color-mix(in srgb, #9dd3ba 14%, transparent),
        0 14px 42px rgba(0, 0, 0, 0.38);
    }
    canvas.hash {
      display: block;
      height: 46px;
      width: auto;
      max-width: 100%;
      margin: 0 auto 22px;
      image-rendering: pixelated;
    }
    .main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px 20px;
      text-align: left;
      margin-bottom: 18px;
    }
    .cover {
      width: 148px;
      height: 148px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #2b2f36;
      background: #0a0c0e;
    }
    .cover[hidden] { display: none; }
    .meta { flex: 1 1 180px; min-width: 0; }
    .meta p { margin: 0 0 6px; line-height: 1.35; }
    .artist { font-size: 0.85rem; color: #9aa0a8; }
    .title { font-size: 1.12rem; font-weight: 650; }
    .licence { font-size: 0.82rem; color: #9aa0a8; }
    .licence a { color: #9dd3ba; }
    .lecteur {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 56px;
      margin-bottom: 14px;
      padding: 0 4px;
    }
    #lire {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid color-mix(in srgb, #9dd3ba 55%, transparent);
      background: rgba(8, 10, 14, 0.35);
      color: #f2f4f5;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #lire:hover, #lire:focus-visible {
      border-color: #9dd3ba;
      box-shadow: 0 0 14px rgba(157, 211, 186, 0.35);
    }
    #lire svg { width: 18px; height: 18px; fill: currentColor; }
    .ligne {
      position: relative;
      flex: 1;
      height: 2px;
      overflow: hidden;
      border-radius: 1px;
      background: color-mix(in srgb, #9dd3ba 45%, transparent);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    }
    .lecteur.joue .ligne::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30%;
      background: linear-gradient(90deg, transparent, #c5ead8, transparent);
      animation: glisse 2.4s linear infinite;
    }
    @keyframes glisse {
      from { left: -30%; }
      to { left: 100%; }
    }
    .volume {
      flex: none;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #c9cdd2;
    }
    #muet {
      flex: none;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    #muet:hover, #muet:focus-visible { color: #9dd3ba; }
    #muet svg { width: 18px; height: 18px; fill: currentColor; }
    #volume { width: 84px; accent-color: #9dd3ba; cursor: pointer; }
    .paroles {
      min-height: 4.4em;
      margin: 0 4px 14px;
      font-size: 1.02rem;
      line-height: 1.4;
    }
    .paroles[hidden] { display: none; }
    .paroles p { margin: 0; }
    .paroles .vers { font-weight: 600; color: #f2f4f5; }
    .paroles .vers .chante { color: #9dd3ba; }
    .paroles .apres { margin-top: 6px; font-size: 0.86rem; color: #6b7280; }
    .links {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.85;
      color: #6b7280;
    }
    .links a {
      color: #9dd3ba;
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, #9dd3ba 35%, transparent);
    }
    .links a:hover { color: #c5ead8; }
    #fond-direct {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: #000;
    }
    #fond-direct[hidden] { display: none; }
    #fond-direct iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: max(100vw, 177.78vh);
      height: max(100vh, 56.25vw);
      transform: translate(-50%, -50%);
      border: 0;
    }
    body.avec-direct { background: transparent; }
    body.avec-direct .wrap,
    body.flotte.avec-direct .wrap {
      position: fixed;
      left: auto;
      top: auto;
      right: 18px;
      bottom: 18px;
      width: max-content;
      max-width: none;
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      text-shadow: none;
      animation: none;
      cursor: default;
    }
    body.avec-direct .wrap > :not(#bouton-direct) { display: none; }
    #bouton-direct {
      position: absolute;
      right: 22px;
      bottom: 0;
      transform: translateY(50%);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px 5px 10px;
      font: 700 11px/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.12em;
      color: #f2f4f5;
      text-shadow: none;
      background: #12161b;
      border: 1px solid color-mix(in srgb, #9dd3ba 40%, #2b2f36);
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    #bouton-direct:hover, #bouton-direct:focus-visible {
      border-color: #ff3b30;
      box-shadow: 0 0 16px rgba(255, 59, 48, 0.4);
      transform: translateY(50%) scale(1.06);
    }
    #bouton-direct[hidden] { display: none; }
    #bouton-direct .point {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 6px #ff3b30;
      animation: pouls 1.6s ease-in-out infinite;
    }
    @keyframes pouls {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    body.avec-direct #bouton-direct {
      position: static;
      transform: none;
      gap: 8px;
      padding: 14px 16px 14px 14px;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: #f2f4f5;
      background: rgba(13, 16, 20, 0.78);
      border: 1px solid color-mix(in srgb, #9dd3ba 40%, #2b2f36);
      border-radius: 12px;
      box-shadow:
        0 0 0 1px color-mix(in srgb, #9dd3ba 14%, transparent),
        0 14px 32px rgba(0, 0, 0, 0.45);
    }
    body.avec-direct #bouton-direct:hover,
    body.avec-direct #bouton-direct:focus-visible {
      transform: none;
      border-color: #ff3b30;
      box-shadow: 0 0 16px rgba(255, 59, 48, 0.35);
    }

    body.flotte { padding: 36px 16px; }
    @property --fx { syntax: "<length>"; inherits: false; initial-value: 0px; }
    @property --fy { syntax: "<length>"; inherits: false; initial-value: 0px; }
    /* left/top rather than transform: a transform would isolate the box, and
       the Radivu bar could no longer blend with the live behind it. */
    body.flotte .wrap {
      left: calc(var(--dx, 0px) + var(--fx));
      top: calc(var(--dy, 0px) + var(--fy));
      animation: flotte 11s ease-in-out infinite;
      cursor: grab;
      touch-action: pan-y;
    }
    body.flotte .wrap.tenue {
      cursor: grabbing;
      user-select: none;
      box-shadow:
        0 0 0 1px color-mix(in srgb, #9dd3ba 24%, transparent),
        0 26px 64px rgba(0, 0, 0, 0.5);
    }
    @keyframes flotte {
      0%, 100% { --fx: 0px; --fy: 0px; }
      30% { --fx: 4px; --fy: -8px; }
      65% { --fx: -3px; --fy: -3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      body.flotte .wrap, #bouton-direct .point, .lecteur.joue .ligne::after { animation: none; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>

<body>
  <div class="wrap">

    <div class="main">

  <script>
    const HASH = "#FREETECHNORADIO";
    const GLYPHS = {
      "#": ["01010","11111","01010","11111","01010","00000","00000"],
      A: ["01110","10001","10001","11111","10001","10001","10001"],
      C: ["01110","10001","10000","10000","10000","10001","01110"],
      D: ["11110","10001","10001","10001","10001","10001","11110"],
      E: ["11111","10000","10000","11110","10000","10000","11111"],
      F: ["11111","10000","10000","11110","10000","10000","10000"],
      H: ["10001","10001","10001","11111","10001","10001","10001"],
      I: ["01110","00100","00100","00100","00100","00100","01110"],
      N: ["10001","11001","10101","10011","10001","10001","10001"],
      O: ["01110","10001","10001","10001","10001","10001","01110"],
      R: ["11110","10001","10001","11110","10100","10010","10001"],
      T: ["11111","00100","00100","00100","00100","00100","00100"],
    };
    function paintHash() {
      const cell = 3, gap = 1, step = cell + gap, stride = 6;
      const tile = document.createElement("canvas");
      tile.width = HASH.length * stride * step - gap;
      tile.height = 7 * step - gap;
      const t = tile.getContext("2d");
      t.fillStyle = "#9dd3ba";
      for (let i = 0; i < HASH.length; i++) {
        const rows = GLYPHS[HASH[i]] || [];
        for (let y = 0; y < rows.length; y++) {
          for (let x = 0; x < rows[y].length; x++) {
            if (rows[y][x] === "1") t.fillRect((i * stride + x) * step, y * step, cell, cell);
          }
        }
      }
      const canvas = document.getElementById("hash");
      const scale = Math.max(4, Math.min(8, Math.floor((canvas.parentElement.clientWidth || 480) / tile.width)));
      canvas.width = tile.width * scale;
      canvas.height = tile.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tile, 0, 0, canvas.width, canvas.height);
    }
    paintHash();
    window.addEventListener("resize", paintHash);

    const audio = document.getElementById("audio");
    const stream = location.origin + "/index.m3u8";
    const lance = new URLSearchParams(location.search).get("play") === "1";
    let hls = null;

    function tenteLecture() {
      if (!lance) return;
      audio.play().catch(() => {});
    }

    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "benprieur-radio-play") audio.play().catch(() => {});
    });

    function demarreHls() {
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(stream);
        hls.attachMedia(audio);
        hls.on(Hls.Events.MANIFEST_PARSED, tenteLecture);
      } else if (audio.canPlayType("application/vnd.apple.mpegurl")) {
        audio.src = stream;
        audio.addEventListener("loadedmetadata", tenteLecture, { once: true });
      }
    }
    demarreHls();

    const lecteur = document.getElementById("lecteur");
    const lire = document.getElementById("lire");
    const lireIcone = document.getElementById("lire-icone");
    const volume = document.getElementById("volume");
    const muet = document.getElementById("muet");
    const muetIcone = document.getElementById("muet-icone");
    const ICONE_SON = "M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4z";
    const ICONE_MUET = "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z";
    let volumeAvant = 0.8;
    try {
      const v = parseFloat(localStorage.getItem("ftr-volume"));
      if (v >= 0 && v <= 1) volume.value = String(v);
    } catch (_) {}
    audio.volume = Number(volume.value);
    if (audio.volume > 0) volumeAvant = audio.volume;

    function silencieux() {
      return audio.muted || Number(volume.value) === 0;
    }
    function poseMuet() {
      const off = silencieux();
      muetIcone.setAttribute("d", off ? ICONE_MUET : ICONE_SON);
      muet.setAttribute("aria-pressed", off ? "true" : "false");
      muet.setAttribute("aria-label", off ? "Unmute" : "Mute");
    }
    poseMuet();
    muet.addEventListener("click", () => {
      if (silencieux()) {
        audio.muted = false;
        const revient = volumeAvant > 0 ? volumeAvant : 0.8;
        volume.value = String(revient);
        audio.volume = revient;
        try { localStorage.setItem("ftr-volume", volume.value); } catch (_) {}
      } else {
        volumeAvant = Number(volume.value);
        audio.muted = true;
      }
      poseMuet();
    });
    volume.addEventListener("input", () => {
      audio.volume = Number(volume.value);
      audio.muted = Number(volume.value) === 0;
      if (audio.volume > 0) volumeAvant = audio.volume;
      poseMuet();
      try { localStorage.setItem("ftr-volume", volume.value); } catch (_) {}
    });

    function etatLecture() {
      const joue = !audio.paused;
      lecteur.classList.toggle("joue", joue);
      lireIcone.setAttribute("d", joue ? "M6 5h4v14H6zM14 5h4v14h-4z" : "M8 5v14l11-7z");
      lire.setAttribute("aria-label", joue ? "Pause" : "Play");
    }
    audio.addEventListener("play", etatLecture);
    audio.addEventListener("pause", etatLecture);
    lire.addEventListener("click", () => {
      if (!audio.paused) {
        audio.pause();
        return;
      }
      // A live stream resumes at the edge, not where it was paused.
      if (hls && Number.isFinite(hls.liveSyncPosition)) audio.currentTime = hls.liveSyncPosition;
      audio.play().catch(() => {});
    });

    function pochette(nom) {
      if (!nom) return "";
      if (/^https?:\/\//i.test(nom)) return nom;
      const base = location.origin + "/";
      const chemin = nom.replace(/^\/+/, "");
      return chemin.startsWith("pochettes/") ? base + chemin : base + "pochettes/" + chemin;
    }

    function peint(fiche) {
      if (!fiche) return;
      const artist = document.getElementById("artist");
      const title = document.getElementById("title");
      const licence = document.getElementById("licence");
      const cover = document.getElementById("cover");
      if (fiche.artiste) {
        artist.textContent = fiche.artiste;
        artist.hidden = false;
      }
      if (fiche.titre) {
        title.textContent = fiche.titre;
        title.hidden = false;
      }
      if (fiche.licence) {
        const url = fiche.url_licence || fiche.url || "";
        licence.innerHTML = url
          ? `<a href="${url.replace(/"/g, "&quot;")}" rel="noopener">${fiche.licence}</a>`
          : fiche.licence;
        licence.hidden = false;
      }
      const src = pochette(fiche.pochette);
      if (src) {
        cover.src = src;
        cover.hidden = false;
      }
    }

    async function rafraichitCredit() {
      try {
        const fiche = await fetch("/now.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
        peint(fiche);
      } catch (_) {}
    }
    rafraichitCredit();
    setInterval(rafraichitCredit, 15000);

    // The Pi says where the mix is; what the listener hears is that, minus how
    // far the player sits behind the live edge, minus the segment still being
    // written on the Pi.
    const SEGMENT_EN_COURS_S = 1.5;
    const TENUE_S = 2.4;
    let paroles = { lignes: [], ecoule: 0, lu: 0 };

    function retardLecteur() {
      if (audio.paused) return 0;
      if (hls && Number.isFinite(hls.latency)) return hls.latency + SEGMENT_EN_COURS_S;
      const s = audio.seekable;
      if (s && s.length) return Math.max(0, s.end(s.length - 1) - audio.currentTime) + SEGMENT_EN_COURS_S;
      return 0;
    }

    function ligneALire(lignes, t) {
      let precedente = null, suivante = null;
      for (const l of lignes) {
        const [t0, t1, phrase] = l;
        if (t0 <= t && t < t1) {
          suivante = lignes[lignes.indexOf(l) + 1] || null;
          return { phrase, t0, t1, suivante };
        }
        if (t1 <= t) precedente = l;
        else if (!suivante && t0 > t) suivante = l;
      }
      if (precedente) {
        const [t0, t1, phrase] = precedente;
        const tenue = Math.max(t1, t0 + TENUE_S);
        const plafond = suivante ? suivante[0] : tenue;
        if (t < Math.min(tenue, plafond)) return { phrase, t0, t1: tenue, suivante };
      }
      return { phrase: "", suivante };
    }

    function versEnKaraoke(phrase, t0, t1, t) {
      const mots = phrase.split(/\s+/).filter(Boolean);
      const poids = mots.map((m) => Math.max(m.replace(/[.,;:!?"']/g, "").length, 1));
      const total = poids.reduce((a, b) => a + b, 0) || 1;
      const duree = Math.max(0.05, t1 - t0);
      let curseur = t0;
      return mots.map((mot, i) => {
        const span = document.createElement("span");
        span.textContent = mot + (i < mots.length - 1 ? " " : "");
        if (t >= curseur) span.className = "chante";
        curseur += duree * poids[i] / total;
        return span;
      });
    }

    const blocParoles = document.getElementById("paroles");
    const vers = document.getElementById("vers");
    const versSuivant = document.getElementById("vers-suivant");
    let dernierVers = "";

    function peintParoles() {
      if (!paroles.lignes.length) {
        blocParoles.hidden = true;
        return;
      }
      const t = paroles.ecoule + (performance.now() - paroles.lu) / 1000 - retardLecteur();
      const fin = paroles.lignes[paroles.lignes.length - 1][1];
      if (t > fin + 6) {
        blocParoles.hidden = true;
        return;
      }
      blocParoles.hidden = false;
      const { phrase, t0, t1, suivante } = ligneALire(paroles.lignes, t);
      vers.replaceChildren(...(phrase ? versEnKaraoke(phrase, t0, t1, t) : []));
      const apres = suivante && suivante[0] - t < 12 ? suivante[2] : "";
      if (apres !== dernierVers) {
        versSuivant.textContent = apres;
        dernierVers = apres;
      }
    }

    async function rafraichitParoles() {
      try {
        const avant = performance.now();
        const lu = await fetch("/paroles.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
        const lignes = lu && Array.isArray(lu.lignes) ? lu.lignes.filter((l) => Array.isArray(l) && l.length >= 3) : [];
        paroles = { lignes, ecoule: Number(lu && lu.ecoule) || 0, lu: (avant + performance.now()) / 2 };
      } catch (_) {}
    }
    rafraichitParoles();
    setInterval(rafraichitParoles, 15000);
    setInterval(peintParoles, 200);

    async function rafraichitDogmazic() {
      const lien = document.getElementById("dogmazic");
      try {
        const fiche = await fetch("/dogmazic.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
        if (!fiche?.url) return;
        lien.href = fiche.url;
        const n = fiche.items ?? fiche.installés;
        const note = fiche.à_jour === false ? " (updating…)" : "";
        if (n) lien.textContent = `Dogmazic playlist · ${n} tracks${note}`;
      } catch (_) { /* lien par défaut */ }
    }
    rafraichitDogmazic();

    async function rafraichitRelease() {
      const repo = document.getElementById("repo");
      const ver = document.getElementById("release-ver");
      const site = document.getElementById("site-doc");
      const stream = document.getElementById("stream");
      try {
        const fiche = await fetch("/release.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
        if (!fiche) return;
        if (fiche.site && site) site.href = fiche.site;
        if (fiche.stream && stream) stream.href = fiche.stream;
        if (fiche.repo && repo) repo.href = fiche.repo;
        if (fiche.version && ver) ver.textContent = fiche.version;
      } catch (_) { /* valeurs par défaut dans le HTML */ }
    }
    rafraichitRelease();

    const fondDirect = document.getElementById("fond-direct");
    const boutonDirect = document.getElementById("bouton-direct");
    let videoDirect = "";
    let avecDirect = window.top === window;
    try {
      const choix = localStorage.getItem("ftr-fond-direct");
      if (choix !== null) avecDirect = choix === "1";
    } catch (_) {}

    function poseDirect() {
      const on = avecDirect && !!videoDirect;
      document.body.classList.toggle("avec-direct", on);
      boutonDirect.setAttribute("aria-pressed", on ? "true" : "false");
      boutonDirect.title = on ? "Show the radio" : "Show the YouTube live behind";
      if (!on) {
        fondDirect.hidden = true;
        fondDirect.innerHTML = "";
        return;
      }
      const cadre = fondDirect.querySelector("iframe");
      if (cadre && cadre.dataset.video === videoDirect) return;
      fondDirect.innerHTML = "";
      const neuf = document.createElement("iframe");
      neuf.dataset.video = videoDirect;
      neuf.allow = "autoplay; encrypted-media";
      neuf.title = "YouTube live";
      neuf.src = `https://www.youtube.com/embed/${videoDirect}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&modestbranding=1`;
      fondDirect.appendChild(neuf);
      fondDirect.hidden = false;
    }

    boutonDirect.addEventListener("click", () => {
      avecDirect = !avecDirect;
      try { localStorage.setItem("ftr-fond-direct", avecDirect ? "1" : "0"); } catch (_) {}
      poseDirect();
    });

    async function rafraichitDirect() {
      try {
        const fiche = await fetch("/direct.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null));
        const numero = fiche && fiche.live !== false ? String(fiche.video || "") : "";
        videoDirect = /^[\w-]{11}$/.test(numero) ? numero : "";
      } catch (_) { /* on garde l'état précédent */ }
      boutonDirect.hidden = !videoDirect;
      poseDirect();
    }
    rafraichitDirect();
    setInterval(rafraichitDirect, 60000);

    // Inside the aquarium of benoit-prieur.fr the page is a small iframe:
    // a box that drifts there would only be cut by the frame.
    if (window.top === window) {
      const boite = document.querySelector(".wrap");
      const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.body.classList.add("flotte");
      let dx = 0, dy = 0, vx = 0, vy = 0, prise = null, derive = 0;
      let posX = 0, posY = 0;

      const pose = () => {
        posX = dx; posY = dy;
        boite.style.setProperty("--dx", `${dx}px`);
        boite.style.setProperty("--dy", `${dy}px`);
      };
      const borne = (v, a, b) => Math.min(Math.max(v, Math.min(a, b)), Math.max(a, b));
      const bornes = () => {
        const r = boite.getBoundingClientRect();
        const x0 = r.left - posX, y0 = r.top - posY, m = 8;
        return [m - x0, innerWidth - m - r.width - x0, m - y0, innerHeight - m - r.height - y0];
      };
      const range = () => {
        const [x1, x2, y1, y2] = bornes();
        const nx = borne(dx, x1, x2), ny = borne(dy, y1, y2);
        const rebond = prise ? 0 : -0.5;
        if (nx !== dx) vx *= rebond;
        if (ny !== dy) vy *= rebond;
        dx = nx; dy = ny;
        pose();
      };
      const glisse = () => {
        vx *= 0.95; vy *= 0.95;
        dx += vx; dy += vy;
        range();
        derive = Math.hypot(vx, vy) > 0.1 ? requestAnimationFrame(glisse) : 0;
      };

      boite.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "touch" || e.button !== 0) return;
        if (e.target.closest("a, button, input, label")) return;
        cancelAnimationFrame(derive);
        vx = vy = 0;
        prise = { x: e.clientX - dx, y: e.clientY - dy, px: e.clientX, py: e.clientY, t: performance.now() };
        boite.setPointerCapture(e.pointerId);
        boite.classList.add("tenue");
        e.preventDefault();
      });
      boite.addEventListener("pointermove", (e) => {
        if (!prise) return;
        const t = performance.now(), dt = Math.max(1, t - prise.t);
        vx = vx * 0.6 + ((e.clientX - prise.px) / dt) * 16 * 0.4;
        vy = vy * 0.6 + ((e.clientY - prise.py) / dt) * 16 * 0.4;
        Object.assign(prise, { px: e.clientX, py: e.clientY, t });
        dx = e.clientX - prise.x;
        dy = e.clientY - prise.y;
        range();
      });
      const lache = () => {
        if (!prise) return;
        if (calme || performance.now() - prise.t > 80) vx = vy = 0;
        prise = null;
        boite.classList.remove("tenue");
        if (vx || vy) derive = requestAnimationFrame(glisse);
      };
      boite.addEventListener("pointerup", lache);
      boite.addEventListener("pointercancel", lache);
      window.addEventListener("resize", range);
    }
  </script>
</body>
</html>
